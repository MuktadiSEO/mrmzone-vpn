name: Build apps

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../MRMZone-VPN-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MRMZone-VPN-android
          path: MRMZone-VPN-android.apk

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MRMZone-VPN-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: List files
        run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: MRMZone VPN ${{ inputs.release_tag || github.ref_name }}
          make_latest: true
          body: |
            Free multi-country VPN — ফ্রি মাল্টি-কান্ট্রি ভিপিএন।

            | ডিভাইস | ফাইল |
            |---|---|
            | Android | `MRMZone-VPN-android.apk` |
            | Windows | `MRMZone-VPN-1.0.0-Windows-Setup.exe` (installer) / `MRMZone-VPN-1.0.0-Windows-Portable.exe` |
            | macOS | `MRMZone-VPN-1.0.0-macOS-arm64.dmg` (Apple Silicon) / `MRMZone-VPN-1.0.0-macOS-x64.dmg` (Intel) |
            | Linux | `.deb` / `.AppImage` |

            কম্পিউটারে আগে ফ্রি OpenVPN ইনস্টল করুন: https://openvpn.net/community-downloads/ (Windows), `brew install openvpn` (Mac)।
          files: out/*
